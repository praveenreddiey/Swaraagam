name: Deploy Swaraagam

"on":
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: swaraagam-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare deployment configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Repository secret CLOUDFLARE_API_TOKEN is required." >&2
            exit 1
          fi

          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Repository secret CLOUDFLARE_ACCOUNT_ID is required." >&2
            exit 1
          fi

          if [[ -z "$NEXT_PUBLIC_SITE_URL" ]]; then
            echo "Repository variable NEXT_PUBLIC_SITE_URL is required." >&2
            exit 1
          fi

          if [[ -z "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" ]]; then
            echo "Repository variable NEXT_PUBLIC_TURNSTILE_SITE_KEY is required." >&2
            exit 1
          fi

          if [[ ! "$CLOUDFLARE_D1_DATABASE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "Repository variable CLOUDFLARE_D1_DATABASE_ID must be a valid D1 database ID." >&2
            exit 1
          fi

          sed "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$CLOUDFLARE_D1_DATABASE_ID/" \
            wrangler.example.jsonc > wrangler.jsonc

      - name: Validate and build
        run: npm run check

      - name: Apply migrations and deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.125.0
          command: |
            d1 migrations apply swaraagam-enquiries --remote --config wrangler.jsonc
            deploy --config wrangler.jsonc
